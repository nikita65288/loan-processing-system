apiVersion: batch/v1
kind: Job
metadata:
  name: lps-k6-smoke
  namespace: lps
  labels:
    app.kubernetes.io/name: lps-k6
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lps-k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          imagePullPolicy: IfNotPresent
          args: ["run", "/scripts/load.js"]
          env:
            - name: BASE_URL
              value: http://loan-application-service.lps.svc.cluster.local:8080
            - name: RUN_ID
              value: 'abcdef12'  # Change before each run (exactly 8 hexadecimal chars).
            - name: SCENARIO
              value: smoke
            - name: RATE
              value: '2'
            - name: MAX_RATE
              value: '100'
            - name: DURATION_SECONDS
              value: '20'
            - name: MAX_DURATION_SECONDS
              value: '600'
            - name: VUS
              value: '10'
            - name: MAX_VUS
              value: '50'
            - name: TIMEOUT_SECONDS
              value: '5'
            - name: RESULTS_DIR
              value: /tmp
            - name: SEED
              value: ''
            - name: APPLICATION_ID
              value: ''
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 384Mi}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: lps-k6-scripts
            items:
              - {key: load.js, path: load.js}
              - {key: config.js, path: lib/config.js}
              - {key: data.js, path: lib/data.js}
