---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lps-k8s-prometheus
  namespace: lps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lps-k8s-prometheus
  namespace: lps
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lps-k8s-prometheus
  namespace: lps
subjects:
- kind: ServiceAccount
  name: lps-k8s-prometheus
  namespace: lps
roleRef:
  kind: Role
  name: lps-k8s-prometheus
  apiGroup: rbac.authorization.k8s.io
