---
apiVersion: v1
kind: Service
metadata:
  name: lps-k8s-prometheus
  namespace: lps
spec:
  type: ClusterIP
  selector:
    app: lps-k8s-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lps-k8s-grafana
  namespace: lps
spec:
  type: ClusterIP
  selector:
    app: lps-k8s-grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
