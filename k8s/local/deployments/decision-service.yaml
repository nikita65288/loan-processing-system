apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-service
  namespace: lps
  labels:
    app.kubernetes.io/name: decision-service
    app.kubernetes.io/part-of: lps
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: decision-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decision-service
        app.kubernetes.io/part-of: lps
    spec:
      terminationGracePeriodSeconds: 40
      containers:
      - name: decision-service
        image: lps/decision-service:local-v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: lps-runtime
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
