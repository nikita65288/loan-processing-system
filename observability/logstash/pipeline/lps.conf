input {
  file {
    path => "/lps-logs/*.json.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/lps-sincedb"
    codec => "json"
  }
}
filter {
  if ![service][name] { mutate { add_tag => ["missing_service_name"] } }
  date { match => ["@timestamp", "ISO8601"] target => "@timestamp" }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "lps-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
