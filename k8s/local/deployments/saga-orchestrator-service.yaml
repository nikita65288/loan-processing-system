apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator-service
  namespace: lps
  labels:
    app.kubernetes.io/name: saga-orchestrator-service
    app.kubernetes.io/part-of: lps
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: saga-orchestrator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saga-orchestrator-service
        app.kubernetes.io/part-of: lps
    spec:
      terminationGracePeriodSeconds: 40
      containers:
      - name: saga-orchestrator-service
        image: lps/saga-orchestrator-service:local-v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: lps-runtime
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://host.docker.internal:5432/lps?connectTimeout=5&socketTimeout=10
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: lps-postgres
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lps-postgres
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          value: host.docker.internal
        - name: SPRING_DATA_REDIS_PORT
          value: '6379'
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1024Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
