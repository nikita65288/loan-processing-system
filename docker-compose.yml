services:
  postgres:
    image: postgres:17.11
    container_name: lps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.2
    container_name: lps-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092,K8S://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,K8S://host.docker.internal:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,K8S:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      # Ограничиваем JVM Kafka.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:8.10.2
    container_name: lps-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: lps-prometheus
    profiles: [monitoring]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    mem_limit: 384m

  grafana:
    image: grafana/grafana:12.1.0
    container_name: lps-grafana
    profiles: [monitoring]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    mem_limit: 384m

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: lps-kafka-exporter
    profiles: [monitoring, k8s-monitoring]
    ports: ["9308:9308"]
    command: ["--kafka.server=kafka:29092", "--group.filter=.*", "--topic.filter=.*"]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 128m

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: lps-jaeger
    profiles: [tracing]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318", "4317:4317"]
    mem_limit: 512m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    container_name: lps-elasticsearch
    profiles: [logging]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    mem_limit: 1152m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.3
    container_name: lps-logstash
    profiles: [logging]
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/lps-logs:ro
      - logstash-data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 512m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: lps-kibana
    profiles: [logging]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=512"
    ports: ["5601:5601"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 768m

  # Optional isolated k6 runner; not started by default.
  load-generator:
    image: grafana/k6:2.3.0
    profiles: [load]
    entrypoint: ["k6", "run", "/scripts/load.js"]
    environment:
      BASE_URL: ${LPS_LOAD_BASE_URL:-http://host.docker.internal:8080}
      RUN_ID: ${LPS_LOAD_RUN_ID:-}
      SCENARIO: ${LPS_LOAD_SCENARIO:-smoke}
      RATE: ${LPS_LOAD_RATE:-}
      MAX_RATE: ${LPS_LOAD_MAX_RATE:-100}
      DURATION_SECONDS: ${LPS_LOAD_DURATION_SECONDS:-}
      MAX_DURATION_SECONDS: ${LPS_LOAD_MAX_DURATION_SECONDS:-600}
      VUS: ${LPS_LOAD_VUS:-}
      MAX_VUS: ${LPS_LOAD_MAX_VUS:-}
      TIMEOUT_SECONDS: ${LPS_LOAD_TIMEOUT_SECONDS:-5}
      RESULTS_DIR: /results
      SEED: ${LPS_LOAD_SEED:-}
      APPLICATION_ID: ${LPS_LOAD_APPLICATION_ID:-}
    volumes:
      - ./load-tests/scripts:/scripts:ro
      - ./load-tests/results:/results
    mem_limit: 384m
    cpus: '1.0'

volumes:
  prometheus-data:
  grafana-data:
  elastic-data:
  logstash-data:
  postgres-data:
  kafka-data:
  redis-data:
